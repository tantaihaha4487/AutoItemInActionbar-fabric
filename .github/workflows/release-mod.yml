name: Release mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read mod version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [[ -z "$version" || "$version" == *[![:alnum:]._-]* ]]; then
            echo "mod_version is missing or contains unsafe characters" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle wrapper
        run: ./gradlew build --no-daemon

      - name: Prepare versioned release asset
        shell: bash
        run: cp "build/libs/AutoItemInActionbar-${{ steps.version.outputs.version }}.jar" "AutoItemInActionbar-v${{ steps.version.outputs.version }}.jar"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AutoItemInActionbar-v${{ steps.version.outputs.version }}
          name: AutoItemInActionbar v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: AutoItemInActionbar-v${{ steps.version.outputs.version }}.jar
